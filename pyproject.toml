[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtkrita"
version = "0.1.0.dev0"
description = "Automation-first LINE sticker production engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<12",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2"
]
ui = ["PySide6>=6.8,<7"]

[project.scripts]
mtkrita = "mtkrita.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
