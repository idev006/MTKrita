name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff canonical diff
        shell: pwsh
        run: |
          ruff check --fix src tests
          git diff -- src tests
          if (git diff --quiet -- src tests) { exit 0 } else { exit 1 }
      - name: Tests
        run: pytest --cov=mtkrita --cov-report=term-missing
